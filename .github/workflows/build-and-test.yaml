name: Build and Test

on: [pull_request, push, workflow_dispatch]

permissions:
  contents: read
  security-events: write

jobs:
  vulnerability-scan:
    uses: IABTechLab/uid2-shared-actions/.github/workflows/shared-build-and-test.yaml@v3
    secrets: inherit
    with:
      vulnerability_scan_only: true

  build-and-test:
    name: Build and run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup dotnet
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: '6.0'

      - name: Build solution
        run: dotnet build UID2.Client.sln --configuration Release

      - name: Run unit tests
        run: dotnet test UID2.Client.sln --configuration Release --no-build
